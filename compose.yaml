services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-excel_translator}
      POSTGRES_USER: ${POSTGRES_USER:-excel_translator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  translator-api:
    build: ./project/apps/api
    command: sh -c "npm run prisma:generate && npm run build && npm run start"
    volumes:
      - ./project/apps/api:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - BASE_PATH=/excel-convert
      - DATABASE_URL=postgresql://${POSTGRES_USER:-excel_translator}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-excel_translator}?schema=public
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=gemma4:latest
      - DATA_DIR=/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

  translator-web:
    build: ./project/apps/web
    volumes:
      - ./project/apps/web:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:${API_PORT:-3000}/excel-convert
      - VITE_BASE_PATH=/excel-convert/
    ports:
      - "${WEB_PORT:-5173}:5173"

volumes:
  postgres-data:

