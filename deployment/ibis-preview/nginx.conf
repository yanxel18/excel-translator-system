server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.wasm$ {
    default_type application/wasm;
    gzip_static on;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}
