server {
  listen 80;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;

  location = /api/upload {
    client_max_body_size 51m;
    proxy_pass http://translator-api:3000/excel-convert/upload;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://translator-api:3000/excel-convert/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /preview/ {
    resolver 127.0.0.11 valid=10s;
    set $preview_upstream ibis-preview:80;
    rewrite ^/preview/(.*)$ /$1 break;
    proxy_pass http://$preview_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /excel-convert {
    return 308 /excel-convert/;
  }

  location /excel-convert/ {
    rewrite ^/excel-convert/(.*)$ /$1 last;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
